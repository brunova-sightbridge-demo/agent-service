services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local root .env}
      POSTGRES_DB: ${POSTGRES_DB:-agent_service}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  api:
    build: ./agent-service
    env_file: ./agent-service/.env
    environment:
      EMBEDDING_SERVICE_URL: ${EMBEDDING_SERVICE_URL:-http://embedding-service:8100/embed}
      LLM_SERVICE_URL: ${LLM_SERVICE_URL:-http://llm-service:8200/generate}
      LLM_SERVICE_STREAM_URL: ${LLM_SERVICE_STREAM_URL:-http://llm-service:8200/generate/stream}
    depends_on:
      embedding-service:
        condition: service_healthy
      llm-service:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports: ["127.0.0.1:${API_HOST_PORT:-8001}:8000"]
    volumes:
      - ${UPLOADS_HOST_DIR:-./agent-service/app/data/uploads}:/app/app/data/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    build: ./agent-service
    command: ["python", "-m", "app.ingestion.worker"]
    env_file: ./agent-service/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    profiles: ["worker"]
    volumes:
      - ${UPLOADS_HOST_DIR:-./agent-service/app/data/uploads}:/app/app/data/uploads

  embedding-service:
    build: ./embedding-service
    env_file: ./agent-service/.env
    expose: ["8100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  llm-service:
    build: ./llm-service
    env_file: ./agent-service/.env
    expose: ["8200"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
